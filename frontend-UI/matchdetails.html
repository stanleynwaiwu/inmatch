<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/dd74cbff5f.js" crossorigin="anonymous"></script>
  <title>Match Details</title>
  <style>
    body {
      background-color: #1C1C1C;
      font-family: 'Poppins', sans-serif;
      padding: 20px;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1400px; /* widened to accommodate larger stats section */
      margin: auto;
    }

    @media (min-width: 768px) {
      .main-content {
        flex-direction: row;
        justify-content: space-between;
      }
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .left-column {
        max-width: 700px;
      }
    }

    .match-container,
    .video-gallery,
    .stats-section {
      background-color: #fcf6f6;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(98, 97, 97, 0.6);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .team-score {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team img {
      width: 50px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 3rem;
      font-weight: bold;
    }

    .details {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .team-details {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .video-container {
      display: flex;
      align-items: center;
      padding: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .video-container:hover {
      background-color: #ececec;
    }

    .play-icon {
      font-size: 3rem;
      margin-right: 10px;
    }

    .video-content {
      display: none;
      margin-top: 10px;
    }

    .video-content video {
      width: 100%;
      border-radius: 10px;
    }

    .stat-item {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
    }

    .stat-item:last-child {
      border-bottom: none;
    }

    /* Ensure stats section is visually wider */
    .stats-section {
      flex: 1;
      min-width: 400px;
    }

    /* Scroll-to-top button styles */
    #scrollToTopBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: none;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 50%;
      padding: 12px;
      cursor: pointer;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 100;
      transition: background-color 0.3s;
    }

    #scrollToTopBtn:hover {
      background-color: #3730a3;
    }
  </style>
</head>

<body style="background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/dot-grid.png');">

  <!-- Sticky Header -->
  <header class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto py-4 px-4 relative flex items-center justify-between">
      <!-- Back Button -->
      <button onclick="history.back()" class="absolute left-4 text-white hover:text-yellow-300 text-2xl transition">
        <i class="fas fa-arrow-left"></i>
      </button>

      <div class="flex flex-col items-center w-full">
        <img src="./images/inmatch logo.png" alt="InMatch Logo" class="h-10 mx-auto mb-1">
        <p class="text-lg">Match Details</p>
      </div>

      <!-- Admin Login -->
      <a href="/admin/admin-login.html" target="_blank" rel="noopener noreferrer"
         class="text-white hover:text-yellow-300 transition absolute top-4 right-14">
        <i class="fas fa-user text-2xl"></i>
      </a>

      <!-- Dark Mode Toggle -->
      <button id="toggle-theme" class="absolute top-4 right-4 text-white hover:text-yellow-300 text-2xl transition">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <div class="main-content">
    <div class="left-column">
      <div class="match-container" id="match-container">
        <!-- Populated by JS -->
      </div>

      <div class="video-gallery">
        <div class="video-header text-center text-xl mb-4">Events</div>
        <div id="videoList" class="video-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <div class="stats-section">
      <div class="stats-header text-center text-xl mb-4">Match Stats</div>
      <div id="stats-container">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Scroll to Top Button -->
  <button id="scrollToTopBtn" title="Go to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script src="./js/matchdetails.js"></script>

  <!-- Scroll to Top Script -->
  <script>
    const scrollToTopBtn = document.getElementById("scrollToTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 200) {
        scrollToTopBtn.style.display = "block";
      } else {
        scrollToTopBtn.style.display = "none";
      }
    });

    scrollToTopBtn.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
